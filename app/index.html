<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drug Classification - ML CI/CD</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      box-sizing: border-box;
      margin: 3rem auto;
      max-width: 42rem;
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 2rem rgb(15 23 42 / 12%);
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
      font-weight: 600;
    }

    input,
    select,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      font: inherit;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #eff6ff;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Drug Classification</h1>
    <p>ML CI/CD demonstration interface.</p>

    <form id="prediction-form">
      <label>
        Age
        <input id="age" type="number" min="0" value="30" required>
      </label>
      <label>
        Sex
        <select id="sex">
          <option>F</option>
          <option>M</option>
        </select>
      </label>
      <label>
        Blood pressure category
        <select id="bp">
          <option>LOW</option>
          <option selected>NORMAL</option>
          <option>HIGH</option>
        </select>
      </label>
      <label>
        Cholesterol category
        <select id="cholesterol">
          <option>NORMAL</option>
          <option>HIGH</option>
        </select>
      </label>
      <label>
        Na_to_K ratio
        <input id="na-to-k" type="number" min="0" step="any" value="15" required>
      </label>
      <button type="submit">Classify</button>
    </form>

    <div id="result" role="status">Enter values and select Classify.</div>
  </main>

  <script>
    const form = document.querySelector("#prediction-form");
    const result = document.querySelector("#result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const age = Number(document.querySelector("#age").value);
      const naToK = Number(document.querySelector("#na-to-k").value);

      if (age < 0 || naToK < 0) {
        result.textContent = "Values must be non-negative.";
        return;
      }

      result.textContent =
        "Interface working. Connect the deployed model endpoint for predictions.";
    });
  </script>
</body>
</html>
