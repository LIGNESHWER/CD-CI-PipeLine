<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Drug Classification - ML CI/CD</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --accent: #2563eb;
      --border: #d4d4d8;
      --bg: #ffffff;
      --fg: #18181b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #3f3f46;
        --bg: #18181b;
        --fg: #fafafa;
      }
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 1.5rem; }
    p.description { color: #71717a; margin-top: -0.5rem; }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      gap: 0.25rem;
    }
    input, select {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 1rem;
    }
    button {
      grid-column: 1 / -1;
      padding: 0.6rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .result {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }
    .result strong { font-size: 1.2rem; }
    .status { grid-column: 1 / -1; font-size: 0.9rem; color: #71717a; }
  </style>
</head>

<body>

<h1>Drug Classification</h1>
<p class="description">
  Educational ML demonstration using a trained Scikit-learn pipeline,
  running fully client-side via ONNX Runtime Web.
</p>

<form id="predict-form">
  <label>
    Age
    <input type="number" id="age" value="30" min="0" required>
  </label>

  <label>
    Sex
    <select id="sex">
      <option value="F">F</option>
      <option value="M">M</option>
    </select>
  </label>

  <label>
    Blood Pressure Category
    <select id="bp">
      <option value="LOW">LOW</option>
      <option value="NORMAL" selected>NORMAL</option>
      <option value="HIGH">HIGH</option>
    </select>
  </label>

  <label>
    Cholesterol Category
    <select id="cholesterol">
      <option value="NORMAL" selected>NORMAL</option>
      <option value="HIGH">HIGH</option>
    </select>
  </label>

  <label>
    Na_to_K Ratio
    <input type="number" id="na_to_k" value="15.0" step="0.1" min="0" required>
  </label>

  <span class="status" id="status">Loading model...</span>

  <button type="submit" id="submit-btn" disabled>Predict</button>

  <div class="result" id="result">
    <div>Predicted Class: <strong id="predicted-class"></strong></div>
    <div>Model Confidence: <strong id="confidence"></strong></div>
  </div>
</form>

<script>
  const MODEL_URL = "model/drug_model.onnx";

  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const resultEl = document.getElementById("result");
  const predictedClassEl = document.getElementById("predicted-class");
  const confidenceEl = document.getElementById("confidence");

  let session = null;

  async function loadModel() {
    try {
      session = await ort.InferenceSession.create(MODEL_URL);
      statusEl.textContent = "Model loaded.";
      submitBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = "Failed to load model: " + err.message;
      console.error(err);
    }
  }

  async function predict(event) {
    event.preventDefault();

    const age = Number(document.getElementById("age").value);
    const sex = document.getElementById("sex").value;
    const bp = document.getElementById("bp").value;
    const cholesterol = document.getElementById("cholesterol").value;
    const naToK = Number(document.getElementById("na_to_k").value);

    if (Number.isNaN(age) || Number.isNaN(naToK) || age < 0 || naToK < 0) {
      statusEl.textContent = "Enter valid, non-negative numerical values.";
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = "Predicting...";

    try {
      const feeds = {
        Age: new ort.Tensor("int64", BigInt64Array.from([BigInt(Math.round(age))]), [1, 1]),
        Sex: new ort.Tensor("string", [sex], [1, 1]),
        BP: new ort.Tensor("string", [bp], [1, 1]),
        Cholesterol: new ort.Tensor("string", [cholesterol], [1, 1]),
        Na_to_K: new ort.Tensor("float64", Float64Array.from([naToK]), [1, 1]),
      };

      const output = await session.run(feeds);
      const label = output.label.data[0];
      const probabilities = output.probabilities.data;
      const maxProb = Math.max(...probabilities);

      predictedClassEl.textContent = label;
      confidenceEl.textContent = (maxProb * 100).toFixed(2) + "%";
      resultEl.style.display = "block";
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "Prediction failed: " + err.message;
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  }

  document.getElementById("predict-form").addEventListener("submit", predict);
  loadModel();
</script>

</body>
</html>
